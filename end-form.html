<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>end form</title>
  </head>
  <body>
    <header>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li>
            <a href="battle-of-normandy-beaches.html"
              >Battle of Normandy beaches</a
            >
          </li>
          <li>
            <a href="bombing-of-pearl-harbor.html">Bombing of Pearl Harbor</a>
          </li>
          <li><a href="end-form.html">End Form</a></li>
        </ul>
      </nav>
      <h1>Your opinion</h1>
    </header>
    <main>
      <form name="favorite-topic-form" id="favorite-topic-form" method="get">
        <fieldset>
          <legend>What was your favorite topic?</legend>
          <!-- what a legend tag does is it gives a title to the fieldset.
          -->
          <input type="radio" id="normandy" name="topic" value="normandy" />
          <!--what the input type="radio" does is it gives the user a optinon to choose an 
          answer in a mulitple choice format.
          -->
          <label for="normandy">Battle of Normandy beaches</label><br />
          <input
            type="radio"
            id="pearl-harbor"
            name="topic"
            value="pearl-harbor" />
          <label for="pearl-harbor"> Pearl Harbor</label>
          <!-- a label tag is used to define a label for a input
          -->
          <!-- a id attribute is used to give a unique identifier to 
          the input so that it can be referenced by the label tag.
          -->
          <!-- a name attribute is used to group the radio buttons together 
          so that only one can be selected at a time.
          -->
        </fieldset>
        <!-- the fieldset tag is the box/conatiner that surrounds the form.
        -->
        <br />
        <p>
          <label for="recommendations"
            >Recommendations on ww2 topics you'll think I'll like:</label
          >
        </p>
        <textarea
          id="recommendations"
          name="recommendations"
          rows="4"
          cols="40">
        </textarea>
        <!-- 
          the textarea gives the user a larger area for the users opinion 
          if they want to type something thats more takes more the one line. 
        -->
      </br />
      <br />
        <label for="favorite-beach"
          >What was your favorite beach?(if you had)</label
        >
        <select id="favorite-beach" name="favorite-beach">
          <option value="utah">Utah</option>
          <option value="oregon">Sword</option>
          <option value="california">Gold</option>
          <option value="junoo">Juno</option>
          <!--value attribute is used to specify the value that will be submitted when the form is sent 
          -->
          <option value="omaha">Omaha</option>
          <!-- option tag is used to select a option instead of a multiple choice format 
          -->
        </select>
        <br />
        <input
          type="image"
          src="images/green-check.jpg"
          alt="Submit button"
          width="100"
          height="100" />
      </form>
    </main>
  </body>
</html>
